<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-label="Yaz — свободная клавиатура для Android">
  <title>Yaz — свободная клавиатура для Android</title>
  <desc>Зелёный весенний баннер с листьями, цветами и каллиграфической надписью Yaz.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4CAF50"/>
      <stop offset="0.45" stop-color="#2E7D32"/>
      <stop offset="1" stop-color="#1B5E20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.68">
      <stop offset="0" stop-color="#C8E6C9" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#A5D6A7" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#A5D6A7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F5E9"/>
    </linearGradient>

    <g id="leaf">
      <path d="M0 0 C18 -26 54 -26 76 0 C54 26 18 26 0 0 Z" fill="#C8E6C9" fill-opacity="0.20"/>
      <path d="M4 0 H72" stroke="#E8F5E9" stroke-opacity="0.35" stroke-width="2"/>
      <path d="M38 0 C40 -10 42 -18 46 -24 M38 0 C40 10 42 18 46 24" stroke="#E8F5E9" stroke-opacity="0.18" stroke-width="1.5" fill="none"/>
    </g>

    <g id="flower">
      <g fill="#F1F8E9" fill-opacity="0.88">
        <ellipse cx="0" cy="-14" rx="7" ry="13"/>
        <ellipse cx="0" cy="-14" rx="7" ry="13" transform="rotate(72)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="13" transform="rotate(144)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="13" transform="rotate(216)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="13" transform="rotate(288)"/>
      </g>
      <circle r="6.5" fill="#FFD54F" fill-opacity="0.95"/>
    </g>

    <g id="botanical">
      <path d="M-30 445 C60 405 118 332 140 250 C154 188 198 136 282 116" stroke="#C8E6C9" stroke-opacity="0.45" stroke-width="3" fill="none"/>
      <path d="M-25 478 C90 462 182 424 246 366" stroke="#A5D6A7" stroke-opacity="0.30" stroke-width="2" fill="none"/>
      <path d="M54 382 C82 360 108 350 140 352" stroke="#C8E6C9" stroke-opacity="0.30" stroke-width="2" fill="none"/>
      <path d="M126 246 C156 228 184 222 214 226" stroke="#C8E6C9" stroke-opacity="0.28" stroke-width="2" fill="none"/>

      <use href="#leaf" transform="translate(58 372) rotate(-50) scale(0.95)"/>
      <use href="#leaf" transform="translate(93 318) rotate(28) scale(0.75)"/>
      <use href="#leaf" transform="translate(120 258) rotate(-62) scale(0.85)"/>
      <use href="#leaf" transform="translate(160 205) rotate(20) scale(0.70)"/>
      <use href="#leaf" transform="translate(205 155) rotate(-40) scale(0.80)"/>
      <use href="#leaf" transform="translate(258 127) rotate(15) scale(0.65)"/>
      <use href="#leaf" transform="translate(28 405) rotate(10) scale(0.55)"/>
      <use href="#leaf" transform="translate(145 355) rotate(-15) scale(0.50)"/>

      <use href="#flower" transform="translate(300 114) scale(0.90)"/>
      <use href="#flower" transform="translate(180 235) scale(0.55)"/>
      <use href="#flower" transform="translate(88 392) scale(0.45)"/>

      <circle cx="232" cy="88" r="3" fill="#DCEDC8" fill-opacity="0.40"/>
      <circle cx="322" cy="170" r="2.5" fill="#DCEDC8" fill-opacity="0.35"/>
      <circle cx="70" cy="300" r="2" fill="#DCEDC8" fill-opacity="0.35"/>
      <circle cx="252" cy="66" r="2" fill="#DCEDC8" fill-opacity="0.30"/>
      <circle cx="340" cy="250" r="2" fill="#DCEDC8" fill-opacity="0.25"/>
    </g>
  </defs>

  <rect width="1600" height="360" rx="28" fill="url(#background)"/>
  <rect width="1600" height="360" rx="28" fill="url(#glow)"/>

  <g transform="translate(0 -10) scale(1 0.78)">
    <use href="#botanical"/>
    <use href="#botanical" transform="translate(1600 0) scale(-1 1)"/>
  </g>

  <text x="800" y="230" text-anchor="middle" font-family="'URW Chancery L', 'Z003', 'Apple Chancery', 'Segoe Script', 'Brush Script MT', cursive" font-size="138" font-style="italic" letter-spacing="2" fill="url(#wordmark)">Yaz</text>
</svg>
